<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Banner - Jalte Diye Foundation. View and download our official banner PDF.">
    <title>Banner - Jalte Diye Foundation</title>
    <link rel="icon" href="images/icon.png">
    <link rel="stylesheet" href="css/style.css">
        <style>
            /* Strongly enforce light theme for PDF viewer */
            .pdf-container,
            .pdf-container iframe,
            iframe.pdf-container {
                background: #fff !important;
                border: 1px solid #ddd !important;
                color-scheme: light !important;
                filter: invert(0) !important;
                color: #222 !important;
            }
            /* Remove any dark mode filter from parent containers */
            html, body, #banner-page, .document-page, .policy-content {
                background: #fff !important;
                color: #222 !important;
                color-scheme: light !important;
            }
        </style>
</head>

<body>
    <main class="page document-page footer-linked-page" id="banner-page">
        <div id="site-header"></div>

        <section class="section section--tint">
            <div class="section-title section-title--tight">
                <hr>
                <span>Banner</span>
                <hr>
            </div>

            <div class="policy-content">
                <p>Below is our official banner. You can download or view the full document:</p>
                <p>
                    <a href="Banner.pdf" download class="learn-more-link">Download Banner PDF</a>
                </p>

                <!-- PDF.js viewer container -->
                <div id="pdfjs-viewer" class="pdf-container" data-pdf-url="Banner.pdf" style="background:#fff;"></div>

                <p class="doc-note">
                    If the PDF does not display above, please <a href="Banner.pdf" target="_blank" rel="noopener">open it in a new tab</a>.
                </p>
            </div>
        </section>

        <div id="site-footer"></div>
    </main>
    <script src="js/script.js"></script>
    <script src="js/pdfjs-viewer.js"></script>
</body>

</html>
