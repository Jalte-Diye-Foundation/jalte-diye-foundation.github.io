<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NGO Darpan - Jalte Diye Foundation. View and download our official NGO Darpan PDF.">
    <title>NGO Darpan - Jalte Diye Foundation</title>
    <link rel="icon" href="images/icon.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Strongly enforce light theme for PDF viewer */
        .pdf-container,
        .pdf-container iframe,
        iframe.pdf-container {
            background: #fff !important;
            border: 1px solid #ddd !important;
            color-scheme: light !important;
            filter: invert(0) !important;
            color: #222 !important;
        }
        /* Remove any dark mode filter from parent containers */
        html, body, #banner-page, .document-page, .policy-content {
            background: #fff !important;
            color: #222 !important;
            color-scheme: light !important;
        }
        /* Responsive PDF fit-to-width */
        .pdf-container {
            display: block;
            width: 100%;
            max-width: 900px;
            min-height: 70vh;
            aspect-ratio: 16/9;
            margin: 24px auto 16px auto;
            border-radius: 12px;
            box-shadow: 0 2px 16px 0 rgba(0,0,0,0.04);
        }
        @media (max-width: 1000px) {
            .pdf-container {
                max-width: 100vw;
                min-height: 60vw;
            }
        }
    </style>
</head>

<body>
    <main class="page document-page footer-linked-page" id="banner-page">
        <div id="site-header"></div>

        <section class="section section--tint">
            <div class="section-title section-title--tight">
                <hr>
                <span>NGO Darpan</span>
                <hr>
            </div>

            <div class="policy-content">
                <p>Below is our official NGO Darpan certificate. You can download or view the full document:</p>
                <p>
                    <a href="NGO-Darpan.pdf" download class="learn-more-link">Download NGO Darpan PDF (Last updated July 18, 2025)</a>
                </p>

                <!-- PDF.js viewer container -->
                <div id="pdfjs-viewer" class="pdf-container" data-pdf-url="NGO-Darpan.pdf" style="background:#fff;"></div>

                <p class="doc-note">
                    If the PDF does not display above, please <a href="NGO-Darpan.pdf" target="_blank" rel="noopener">open it in a new tab</a>.
                </p>
            </div>
        </section>

        <div id="site-footer"></div>
    </main>
    <script src="js/script.js"></script>
    <script src="js/pdfjs-viewer.js"></script>
</body>
</html>
