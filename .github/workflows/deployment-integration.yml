name: Deployment Integration

on:
  push:
    branches:
      - deploy
      - main
  pull_request:
    branches:
      - main
      - deploy
  workflow_dispatch:

jobs:
  deployment-readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate deployment package integrity
        run: |
          node .github/scripts/ci_validate.js
          node .github/scripts/ci_link_check.js

      - name: Build static bundle archive
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.venv' \
            ! -name 'website-build.tgz' \
            -print0 \
            | tar --null -czf website-build.tgz --files-from -

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: website-build.tgz
