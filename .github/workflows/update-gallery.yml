name: Update Gallery Manifest

on:
  push:
    paths:
      - "gallery/**"

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        - name: Generate gallery/images.json (recursive)
        run: |
          cd gallery
          python3 <<'EOF'
    import os, json
    result = {}
    for root, dirs, files in os.walk('.'):
      section = None
      if root == '.':
        continue
      if root.startswith('./'):
        section = root[2:]
      else:
        section = root
      images = [os.path.join(section, f).replace('\\', '/') for f in sorted(files) if f.lower().endswith((".jpg", ".jpeg", ".png", ".gif", ".webp", ".avif", ".svg"))]
      if images:
        result[section.replace('/', ' ')] = images
    with open('images.json', 'w', encoding='utf-8') as out:
      json.dump(result, out, indent=2)
    print("Generated images.json:")
    with open('images.json', 'r', encoding='utf-8') as f:
      print(f.read())
    EOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery/images.json
          if git diff --cached --quiet; then
            echo "No changes to images.json, skipping commit."
          else
            git commit -m "chore: update gallery/images.json [skip ci]"
            git push
          fi
