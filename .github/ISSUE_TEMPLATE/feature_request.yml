name: Feature request
description: Suggest an improvement or new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing your idea. Please explain the value and scope.

  - type: input
    id: summary
    attributes:
      label: Feature summary
      description: One-line description of the idea
      placeholder: Add contributor spotlight section on homepage
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your proposed approach
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives or trade-offs

  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Who benefits and how?

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before submitting.
          required: true
        - label: This request aligns with the project mission and website scope.
          required: true
