name: Bug report
description: Report a reproducible problem on the website
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail for us to reproduce it.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the bug
      placeholder: Donate page testimonial does not update after edit
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page URL or file
      description: Affected page URL or repository file path
      placeholder: donate.html
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List clear steps
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 136

  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Windows 11, Android 14, iOS 18

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Screenshots, console logs, or notes
